{{ if eq .RedirectTo "shoutan://sign-in" }}
<h2>Shoutan</h2>
<p>Here is your code for signing in to Shoutan, the Go game:</p>
<p style="font-size: 28px; letter-spacing: 4px"><strong>{{ .Token }}</strong></p>
<p>Type it in the app. If you didn't ask for it, you can ignore this e-mail.</p>
{{ else }}
<h2>Magic Link</h2>
<p>Follow this link to log in:</p>
<p><a href="{{ .ConfirmationURL }}">Log In</a></p>
{{ end }}
