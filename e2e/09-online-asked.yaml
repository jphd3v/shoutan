appId: ${APP_ID}
---
# A family member asks the phone to play: the ask shows in Play online, and Join starts the game.
# scripts/test-online.mjs plays the family member.
- launchApp:
    clearState: true
- tapOn: { id: 'welcome-new' }
- tapOn: { id: 'welcome-name' }
- inputText: ${FIRST_NAME}
# Not hideKeyboard: on Android it presses back, which steps the welcome back.
- scrollUntilVisible:
    element: { id: 'welcome-level-beginner' }
    direction: DOWN
- tapOn: { id: 'welcome-level-beginner' }
- scrollUntilVisible:
    element: { id: 'welcome-avatar-5' }
    direction: DOWN
- tapOn: { id: 'welcome-avatar-5' }
- scrollUntilVisible:
    element: { id: 'welcome-next' }
    direction: DOWN
- tapOn: { id: 'welcome-next' }
# Family sign-in is offered next, and passed by here.
- tapOn: { id: 'welcome-done' }
# The level starts some of the Guide's helps; the flows are written for a plain board.
- runFlow: common/helps-off.yaml
# Play online asks for an email sign-in first, then the family code; the player joins under the welcome's name.
- scrollUntilVisible:
    element: { id: 'hub-play-online' }
    direction: DOWN
- tapOn: { id: 'hub-play-online' }
- runFlow: common/sign-in.yaml
- tapOn: { id: 'family-code' }
- inputText: 'not-the-code'
- tapOn: { id: 'register' }
- extendedWaitUntil:
    visible: 'That family code did not match[.] Please try again[.]'
    timeout: 20000
- tapOn: { id: 'family-code' }
- eraseText: 20
- inputText: 'local-family'
- tapOn: { id: 'register' }
- extendedWaitUntil:
    visible: 'Playing as ${FIRST_NAME}'
    timeout: 20000
- extendedWaitUntil:
    visible: { id: 'invitations' }
    timeout: 60000
- assertVisible: 'Wants to play with you'
- takeScreenshot: asked-to-play
- tapOn: 'Join game'
- extendedWaitUntil:
    visible: { id: 'player-black', text: 'E2E opponent.*' }
    timeout: 30000
- tapOn: { id: 'options' }
- tapOn: { id: 'resign' }
- tapOn: { id: 'resign-yes' }
- extendedWaitUntil:
    visible: { id: 'result-title', text: 'E2E opponent.* wins' }
    timeout: 20000
