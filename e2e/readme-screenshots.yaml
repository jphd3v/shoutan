- extendedWaitUntil:
    visible: { id: 'status', text: '(No stones marked|Check the|Tap a \? group).*' }
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: marking
- tapOn: { id: 'accept', waitToSettleTimeoutMs: 300 }
- tapOn: { id: 'count-next' }
