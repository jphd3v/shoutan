# The screenshots in README.md, from a fresh install: the welcome and cover, the main menu, a beginner
# game against the bot with the Coach, a rated game through marking, the count and the result with the
# rank, and a face-to-face game. Run by hand on the emulator; the images land in the
# output folder's takeScreenshot/ and are copied into screenshots/.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- takeScreenshot: welcome
- tapOn: { id: 'welcome-about' }
- waitForAnimationToEnd
- takeScreenshot: cover
- tapOn: { id: 'welcome-about-cover-close' }

- tapOn: { id: 'welcome-new' }
- tapOn: { id: 'welcome-name' }
- inputText: 'Jane Doe'
- scrollUntilVisible:
    element: { id: 'welcome-level-basics' }
    direction: DOWN
- tapOn: { id: 'welcome-level-basics' }
- scrollUntilVisible:
    element: { id: 'welcome-avatar-5' }
    direction: DOWN
- tapOn: { id: 'welcome-avatar-5' }
- scrollUntilVisible:
    element: { id: 'welcome-next' }
    direction: DOWN
- tapOn: { id: 'welcome-next' }
- tapOn: { id: 'welcome-done' }
- waitForAnimationToEnd
- runFlow:
    file: common/tap-twice.yaml
    env: { NOW: 'off' }
- takeScreenshot: menu

# A beginner game against the bot: the Coach shows its ideas as ghost stones.
- tapOn: { id: 'hub-play-bot' }
- waitForAnimationToEnd
- takeScreenshot: bot-setup
- tapOn: { id: 'hub-beginner' }
- runFlow: { file: common/bot-move.yaml, env: { AT: 'E5' } }
- runFlow: { file: common/bot-move.yaml, env: { AT: 'C5' } }
- runFlow: { file: common/bot-move.yaml, env: { AT: 'G5' } }
- runFlow: { file: common/bot-move.yaml, env: { AT: 'E3' } }
- runFlow: { file: common/bot-move.yaml, env: { AT: 'C3' } }
- extendedWaitUntil:
    visible: { id: 'guide-ideas', text: '.*strongest move.*' }
    timeout: 30000
- takeScreenshot: vs-bot-coach

# The replays run without the Coach and the Guide's helps, which would put advice on the boards.
- tapOn: { id: 'options' }
- tapOn: { id: 'options-settings' }
- scrollUntilVisible:
    element: { id: 'quick-teaching' }
    direction: DOWN
- tapOn: { id: 'quick-teaching' }
- tapOn: { id: 'sheet-close' }
- tapOn: { id: 'options' }
- tapOn: { id: 'options-hub' }
- runFlow: common/helps-off.yaml

