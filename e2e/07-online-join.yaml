appId: ${APP_ID}
---
# The phone joins a game a family member created, captures, leaves and comes back,
# marks a stone, keeps playing and resigns. scripts/test-online.mjs plays Black.
- launchApp:
    clearState: true
- tapOn: { id: 'welcome-new' }
- tapOn: { id: 'welcome-name' }
- inputText: ${FIRST_NAME}
# Not hideKeyboard: on Android it presses back, which steps the welcome back.
- scrollUntilVisible:
    element: { id: 'welcome-level-beginner' }
    direction: DOWN
- tapOn: { id: 'welcome-level-beginner' }
- scrollUntilVisible:
    element: { id: 'welcome-avatar-5' }
    direction: DOWN
- tapOn: { id: 'welcome-avatar-5' }
- scrollUntilVisible:
    element: { id: 'welcome-next' }
    direction: DOWN
- tapOn: { id: 'welcome-next' }
# Family sign-in is offered next, and passed by here.
- tapOn: { id: 'welcome-done' }
# The level starts some of the Guide's helps; the flows are written for a plain board.
- runFlow: common/helps-off.yaml
# Play online asks for an email sign-in first, then the family code; the player joins under the welcome's name.
- scrollUntilVisible:
    element: { id: 'hub-play-online' }
    direction: DOWN
- tapOn: { id: 'hub-play-online' }
- runFlow: common/sign-in.yaml
- tapOn: { id: 'family-code' }
- inputText: 'not-the-code'
- tapOn: { id: 'register' }
- extendedWaitUntil:
    visible: 'That family code did not match[.] Please try again[.]'
    timeout: 20000
- tapOn: { id: 'family-code' }
- eraseText: 20
- inputText: 'local-family'
- tapOn: { id: 'register' }
- extendedWaitUntil:
    visible: 'Playing as ${FIRST_NAME}'
    timeout: 20000
# The name is changed in Profile, and the family sees the new one.
- tapOn: { id: 'hub-back' }
- tapOn: { id: 'hub-profile' }
# Tapped at its end, so the cursor is after the whole name.
- tapOn: { id: 'hub-player-name', point: '95%,50%' }
- eraseText: 30
- inputText: ${PLAYER_NAME}
- tapOn: { id: 'hub-back' }
- scrollUntilVisible:
    element: { id: 'hub-play-online' }
    direction: DOWN
- tapOn: { id: 'hub-play-online' }
- extendedWaitUntil:
    visible: 'Playing as ${PLAYER_NAME}'
    timeout: 20000
- tapOn: { id: 'refresh-lobby' }
- scrollUntilVisible:
    element: { id: 'join-${GAME_ID}' }
    direction: DOWN
    # Past every family member in the lobby, however many a database holds.
    timeout: 60000
- assertVisible: { id: 'join-${GAME_ID}', text: 'Join game' }
- tapOn: { id: 'join-${GAME_ID}' }
- extendedWaitUntil:
    visible: { id: 'player-black', text: 'E2E opponent.*' }
    timeout: 20000
- extendedWaitUntil:
    visible: 'E5, black stone'
    timeout: 20000
# Tap twice to place a stone is on for a new player: a preview tap, then a confirming tap.
- tapOn: { id: 'pt-H9' }
- tapOn: { id: 'pt-H9' }
- extendedWaitUntil:
    visible: 'J9, black stone'
    timeout: 20000
- tapOn: { id: 'pt-J8' }
- tapOn: { id: 'pt-J8' }
- assertVisible: 'J9, empty'
- assertVisible: 'J8, white stone'
- takeScreenshot: online-capture
# The game's New game opens Play online, where the game waits.
- tapOn: { id: 'options' }
- tapOn: { id: 'new-game' }
- scrollUntilVisible:
    element: { id: 'join-${GAME_ID}' }
    direction: DOWN
    # Past every family member in the lobby, however many a database holds.
    timeout: 60000
- assertVisible: { id: 'join-${GAME_ID}', text: 'Open game' }
- tapOn: { id: 'join-${GAME_ID}' }
- extendedWaitUntil:
    visible: 'J8, white stone'
    timeout: 20000
- assertVisible: 'J9, empty'
- extendedWaitUntil:
    visible: 'E2E opponent.* passed · pass too to finish'
    timeout: 20000
- runFlow: { file: common/pass.yaml, env: { PASS: 'pass' } }
- extendedWaitUntil:
    visible: '(No stones marked|Check the|Tap a \? group).*'
    timeout: 20000
# The opponent clears any guessed marks, so E5 shows unmarked before the phone marks it.
- extendedWaitUntil:
    visible: 'E5, black stone'
    timeout: 20000
- retry:
    maxRetries: 3
    commands:
      - tapOn: { id: 'pt-E5' }
      - extendedWaitUntil:
          visible: 'E5, black stone, marked dead'
          timeout: 8000
- takeScreenshot: online-marked
- tapOn: { id: 'resume' }
- extendedWaitUntil:
    visible: { id: 'player-black', text: '.*, to play' }
    timeout: 20000
- assertVisible: 'E5, black stone'
- tapOn: { id: 'options' }
- tapOn: { id: 'resign' }
- assertVisible: 'Resign[?] You will lose this game[.]'
- tapOn: { id: 'resign-yes' }
- extendedWaitUntil:
    visible: { id: 'result-title', text: 'E2E opponent.* wins' }
    timeout: 20000
# After the game, a rematch fitted to the result is offered (the loser gets Black or a stone more).
- assertVisible: { id: 'rematch', text: 'Rematch.*' }
- takeScreenshot: online-resigned
